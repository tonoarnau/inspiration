  ["Apela a la imaginación más que a la lógica fría", "Las historias y símbolos mueven más voluntades que las estadísticas.", "Una buena narrativa vende una idea mejor que una lista de datos."],
  ["Identifica el punto sensible de cada persona", "Cada persona tiene una motivación oculta que explica su comportamiento.", "Entender qué le importa realmente a un colega mejora cualquier negociación con él."],

  ["Influye en las emociones antes que en los argumentos", "Las decisiones se sienten primero y se justifican después con lógica.", "Antes de convencer con datos, asegúrate de que la otra persona se sienta escuchada."],
  ["Usa el espejo para desarmar sin confrontar", "Reflejar el comportamiento de alguien lo hace ver su propio patrón sin acusarlo.", "Repetir con calma lo que el otro acaba de decir puede bajar la tensión de una discusión."],
  ["Impulsa el cambio de forma gradual, no de golpe", "Un cambio demasiado brusco genera resistencia aunque sea, en el fondo, necesario.", "Introduce nuevas ideas paso a paso en un equipo acostumbrado a lo antiguo."],
  ["No aparentes ser perfecto", "La perfección aparente incomoda y despierta envidia o desconfianza.", "Mostrar algún defecto pequeño y humano te hace más cercano y creíble."],
  ["No te excedas más allá del objetivo logrado", "Ir más allá de la meta alcanzada puede convertir una victoria en un error.", "Al conseguir lo que buscabas, detente antes de arriesgarlo todo por más."],
  ["Cultiva la capacidad de adaptarte sin forma fija", "Ser predecible en la forma te vuelve vulnerable ante quien sí se adapta.", "Mantén varias formas de resolver un mismo problema; no dependas de una sola fórmula."],

const ARTE = [
  ["El cálculo previo", "Antes de cualquier conflicto, Sun Tzu insiste en evaluar con honestidad las condiciones propias y ajenas.", "Antes de lanzar un proyecto, haz un diagnóstico realista de recursos, tiempo y competencia."],

  ["Maniobra directa e indirecta", "Lo esperado fija al rival; lo inesperado lo derrota.", "Combina el enfoque convencional con un giro creativo que nadie anticipe."],

  ["Los tipos de terreno", "El lugar donde ocurre el conflicto determina buena parte de quién tiene ventaja.", "Elige el contexto de una negociación difícil: el lugar y el momento ya inclinan la balanza."],

  ["El ataque indirecto", "A veces el golpe más efectivo no es frontal sino sobre lo que sostiene al rival.", "En una negociación estancada, cambia el punto de presión en vez de insistir en el mismo."],
  ["El valor de la información", "Sun Tzu dedica su capítulo final a la inteligencia: saber antes que el otro sepa que sabes.", "Antes de decidir, invierte tiempo en informarte bien; la información buena vale más que la acción rápida."],

const items = [
  ...LEYES.map(([t, d, m], i) => ({ id: i + 1, book: "leyes", title: t, desc: d, modern: m })),
  ...ARTE.map(([t, d, m], i) => ({ id: LEYES.length + i + 1, book: "arte", title: t, desc: d, modern: m })),
];

const PALETTE = [
  "#7A2331", "#2B3A67", "#4A5A3A", "#6B3A52",
  "#1F4B4B", "#5C4425", "#3D2645", "#274156",
  "#5A2A27", "#3A4A2B", "#4B2E39", "#1E3A2F",
];

function randomColor() {
  return PALETTE[Math.floor(Math.random() * PALETTE.length)];
}

const MAX_ROW_COLS = 8;
const HEX_GAP = 3; // fixed px gap between hexes in a row — must match render
const PAGE_PADDING_X = 12; // must match styles.page horizontal padding

function computeHexWidth() {
  if (typeof window === "undefined") return 108;
  const viewportW = window.innerWidth;
  const containerW = Math.min(920, viewportW - PAGE_PADDING_X * 2 - 4);
  // A full row has MAX_ROW_COLS hexes and (MAX_ROW_COLS - 1) gaps between them.
  const w = (containerW - (MAX_ROW_COLS - 1) * HEX_GAP) / MAX_ROW_COLS;
  return Math.max(30, Math.min(108, w));
}

function ColmenaEstrategica() {
  const [selected, setSelected] = useState(null); // { item, rect, phase, flipped, color }
  const [hexW, setHexW] = useState(computeHexWidth);
  const refs = useRef({});

  useEffect(() => {
    function onResize() {
      setHexW(computeHexWidth());
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);

  const HEX_H = Math.round(hexW * 1.1547);

  const openHex = useCallback((item) => {
    const el = refs.current[item.id];
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setSelected({ item, rect, phase: "start", flipped: false, color: randomColor() });
  }, []);

  useEffect(() => {
    if (selected && selected.phase === "start") {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setSelected((s) => (s ? { ...s, phase: "expanded", flipped: true } : s));
        });
      });
    }
  }, [selected && selected.phase]);

  const closeHex = useCallback(() => {
    setSelected((s) => (s ? { ...s, phase: "closing", flipped: false } : s));
    setTimeout(() => setSelected(null), 650);
  }, []);

  useEffect(() => {
    function onKey(e) {
      if (e.key === "Escape" && selected) closeHex();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selected, closeHex]);

  // build honeycomb rows
  const rows = [];
  let cursor = 0;
  const rowSizes = [];
  {
    let idx = 0;
    let toggle = false;
    while (idx < items.length) {
      const size = toggle ? 7 : 8;
      rowSizes.push(Math.min(size, items.length - idx));
      idx += size;
      toggle = !toggle;
    }
  }
  rowSizes.forEach((size, rIdx) => {
    rows.push(items.slice(cursor, cursor + size));
    cursor += size;
  });

  const overlayStyle = (() => {
    if (!selected) return null;
    const isExpanded = selected.phase === "expanded";
    const r = selected.rect;
    return {
      position: "fixed",
      top: isExpanded ? 0 : r.top,
      left: isExpanded ? 0 : r.left,
      width: isExpanded ? "100vw" : r.width,
      height: isExpanded ? "100vh" : r.height,
      clipPath: isExpanded
        ? "polygon(0% 0%,100% 0%,100% 100%,0% 100%)"
        : "polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)",
      transition:
        "top 0.65s cubic-bezier(.65,0,.35,1), left 0.65s cubic-bezier(.65,0,.35,1), width 0.65s cubic-bezier(.65,0,.35,1), height 0.65s cubic-bezier(.65,0,.35,1), clip-path 0.65s cubic-bezier(.65,0,.35,1)",
      zIndex: 100,
      perspective: 1600,
    };
  })();

  return (
    <div style={styles.page}>
      <style>{fontImport}</style>
      <header style={styles.header}>
        <div style={styles.kicker}>ESTRATEGIA · PODER · GUERRA</div>
        <h1 style={styles.h1}>La Colmena</h1>
        <p style={styles.sub}>
          61 celdas. 48 leyes del poder, 13 principios del Arte de la Guerra.
          Toca una celda para abrirla.
        </p>
      </header>

      <div style={styles.hive}>
        {rows.map((row, rIdx) => (
          <div
            key={rIdx}
            style={{
              display: "flex",
              gap: HEX_GAP,
              marginTop: rIdx === 0 ? 0 : -HEX_H * 0.25,
              marginLeft: rIdx % 2 === 1 ? (hexW + HEX_GAP) / 2 : 0,
            }}
          >
            {row.map((item) => (
              <div
                key={item.id}
                ref={(el) => (refs.current[item.id] = el)}
                onClick={() => openHex(item)}
                className="hex-cell"
                style={{
                  ...styles.hex,
                  width: hexW,
                  height: HEX_H,
                  visibility:
                    selected && selected.item.id === item.id && selected.phase !== "closing"
                      ? "hidden"
                      : "visible",
                  background: item.book === "leyes" ? "#161A22" : "#1D1712",
                  borderColor: item.book === "leyes" ? "#3A4A6B33" : "#7A233133",
                }}
              >
                <span style={{ ...styles.hexNum, fontSize: Math.max(12, hexW * 0.17) }}>
                  {String(item.id).padStart(2, "0")}
                </span>
                <span style={styles.hexDot(item.book)} />
              </div>
            ))}
          </div>
        ))}
      </div>

      <div style={styles.legend}>
        <span style={styles.legendItem}>
          <i style={{ ...styles.legendDot, background: "#5B7FD9" }} /> 48 Leyes del Poder
        </span>
        <span style={styles.legendItem}>
          <i style={{ ...styles.legendDot, background: "#C0524B" }} /> El Arte de la Guerra
        </span>
      </div>

      {selected && (
        <>
          <div
            onClick={closeHex}
            style={{
              ...styles.backdrop,
              opacity: selected.phase === "expanded" ? 1 : 0,
              pointerEvents: selected.phase === "expanded" ? "auto" : "none",
            }}
          />
          <div style={overlayStyle}>
            <div
              className="flipper"
              style={{
                width: "100%",
                height: "100%",
                position: "relative",
                transformStyle: "preserve-3d",
                transition: "transform 0.65s cubic-bezier(.65,0,.35,1)",
                transform: `rotateY(${selected.flipped ? 180 : 0}deg)`,
              }}
            >
              {/* FRONT */}
              <div
                style={{
                  ...styles.face,
                  background: selected.item.book === "leyes" ? "#161A22" : "#1D1712",
                }}
              >
                <span
                  style={{
                    ...styles.hexNum,
                    fontSize: selected.phase === "expanded" ? 0 : Math.max(12, hexW * 0.17),
                  }}
                >
                  {String(selected.item.id).padStart(2, "0")}
                </span>
              </div>

              {/* BACK */}
              <div
                style={{
                  ...styles.face,
                  transform: "rotateY(180deg)",
                  background: selected.color,
                  overflowY: "auto",
                }}
              >
                {selected.phase === "expanded" && (
                  <div style={styles.cardContent}>
                    <button style={styles.closeBtn} onClick={closeHex} aria-label="Cerrar">
                      ✕
                    </button>
                    <div style={styles.cardBadge}>
                      {selected.item.book === "leyes" ? "Las 48 Leyes del Poder" : "El Arte de la Guerra"}
                      <span style={styles.cardBadgeNum}>№ {String(selected.item.id).padStart(2, "0")}</span>
                    </div>
                    <h2 style={styles.cardTitle}>{selected.item.title}</h2>
                    <p style={styles.cardDesc}>{selected.item.desc}</p>
                    <div style={styles.cardModernLabel}>Vigencia hoy</div>
                    <p style={styles.cardModern}>{selected.item.modern}</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const fontImport = `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
  .hex-cell { transition: transform 0.25s ease, filter 0.25s ease; cursor: pointer; }
  .hex-cell:hover { transform: scale(1.08); filter: brightness(1.35); z-index: 5; }
  .hex-cell:focus-visible { outline: 2px solid #C9A24B; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .hex-cell, .flipper, .hex-cell * { transition: none !important; }
  }
`;

  legend: {

    justifyContent: "center",
    gap: 28,

    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 12,
